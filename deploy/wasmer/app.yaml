kind: wasmer.io/App.v0
name: webpro-ets
owner: wistarabanyukayana
package: .
env:
    APP_NAME: Spending Tracker
    APP_ENV: production
    APP_DEBUG: 'false'
    LOG_CHANNEL: stderr
    DB_CONNECTION: sqlite
    DB_DATABASE: /data/app.sqlite
    DB_BUSY_TIMEOUT: '5000'
    LARAVEL_STORAGE_PATH: /data/storage
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: sync
# APP_KEY is a Wasmer secret: wasmer app secrets create APP_KEY <value>
volumes:
    - name: data
      mount: /data
# The data volume lives in one region; keep every instance next to it.
locality:
    regions:
        - fr-roub1
# No scaling.mode: single_concurrency. It starts many instances at once, and parallel writers corrupted SQLite on the
# shared volume. The default keeps one instance, which load tests showed serves SQLite safely.
app_id: da_KGzIxtmUPVkW
